name: Generate ML Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_model.txt

      - name: Run model script (forecast + test + enso)
        run: |
          python modeloML.py

      - name: Upload ENSO scenario artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enso_${{ matrix.station }}
          path: data/pred_north.csv

      - name: Upload Model comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: pred_north
          path: data/pred_north.csv

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testsets_north
          path: data/testsets_north.csv

      - name: Commit CSV to repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/
          git commit -m "Update csv " || true
          git pull --rebase origin main
          git push
          
