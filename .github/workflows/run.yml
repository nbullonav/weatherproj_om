name: OpenMeteo Runner
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: pip install -r requirements_dataload.txt

      - name: Run main.py for each station
        run: python main.py
        
      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: station-${{ matrix.station }}
          path: station${{ matrix.station }}.csv

      - name: Move CSV to data folder
        run: |
          mkdir -p data
          mv coordsdata.csv data/

      - name: Commit CSV to repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/
          git commit -m "Update CSV data" || true
          git pull --rebase origin main
          git push
